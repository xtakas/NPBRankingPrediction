name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Blazor WASM app
        run: dotnet publish src/NpbRankingPrediction.Web/NpbRankingPrediction.Web.csproj -c Release -o publish_output

      # GitHub Pagesはプロジェクトページ(https://<user>.github.io/<repo>/)で配信されるため、
      # Blazor WASMの base href をリポジトリ名のサブパスに合わせて書き換える
      - name: Fix base href for GitHub Pages subpath
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"/${{ github.event.repository.name }}/\" />|" publish_output/wwwroot/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish_output/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
